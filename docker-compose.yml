services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: groupops
      POSTGRES_PASSWORD: groupops
      POSTGRES_DB: groupops
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groupops"]
      interval: 2s
      timeout: 3s
      retries: 30
